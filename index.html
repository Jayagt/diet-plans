<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ten-day plans worked through day by day: every meal timed, and every prep step set up the night before.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111510" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://jayagt.github.io/diet-plans/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Diet Plans">
<meta property="og:url" content="https://jayagt.github.io/diet-plans/">
<meta property="og:title" content="Diet Plans">
<meta property="og:description" content="Ten-day plans worked through day by day: every meal timed, and every prep step set up the night before.">
<meta property="og:image" content="https://jayagt.github.io/diet-plans/share-card.png">
<meta property="og:image:type" content="image/png">

<meta property="og:image:height" content="630">

<title>Diet Plans</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F2F5EF; --surface:#FFFFFF; --surface-2:#E9EEE3; --sunken:#EDF1E8;
    --ink:#131A14; --ink-2:#3F4A40; --ink-3:#5A645A;
    --line:#D8DFD2; --line-strong:#C2CCBB;
    --green:#2E6B4C; --green-soft:#DEEDE3; --green-deep:#1E4A34;
    --ochre:#8F5E0D; --ochre-soft:#F5EAD3;
    --slate:#2F4C6B; --slate-soft:#E2EAF2;
    --flag:#A03A1D; --flag-soft:#F7E4DB;
    --press:0 3px 0 var(--line-strong);
    --press-hi:0 6px 0 var(--line-strong), 0 14px 24px -14px rgba(25,32,26,.4);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111510; --surface:#1A2018; --surface-2:#232B21; --sunken:#151A14;
      --ink:#EFF4EC; --ink-2:#BAC5B7; --ink-3:#9AA697;
      --line:#2D3729; --line-strong:#41503C;
      --green:#8FD3AC; --green-soft:#1C2E23; --green-deep:#A8DEC0;
      --ochre:#DFAC5C; --ochre-soft:#2E2617;
      --slate:#93B7DE; --slate-soft:#1A2432;
      --flag:#E4906F; --flag-soft:#2F1D16;
      --press-hi:0 6px 0 var(--line-strong), 0 14px 24px -14px rgba(0,0,0,.9);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111510; --surface:#1A2018; --surface-2:#232B21; --sunken:#151A14;
    --ink:#EFF4EC; --ink-2:#BAC5B7; --ink-3:#9AA697;
    --line:#2D3729; --line-strong:#41503C;
    --green:#8FD3AC; --green-soft:#1C2E23; --green-deep:#A8DEC0;
    --ochre:#DFAC5C; --ochre-soft:#2E2617;
    --slate:#93B7DE; --slate-soft:#1A2432;
    --flag:#E4906F; --flag-soft:#2F1D16;
    --press-hi:0 6px 0 var(--line-strong), 0 14px 24px -14px rgba(0,0,0,.9);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* author rules must not beat the hidden attribute */
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Karla","Helvetica Neue",Arial,sans-serif; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0; text-wrap:balance; font-family:"Newsreader",Georgia,serif; font-weight:500; letter-spacing:-.01em}
  p{margin:0}
  ul{margin:0; padding:0; list-style:none}
  button{font:inherit; color:inherit; cursor:pointer; background:none; border:none; text-align:left}
  :focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:8px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  svg{display:block}

  /* ---------- screen shell: levels 1–3 fit the viewport ---------- */
  .screen{display:none; flex-direction:column; min-height:100vh; min-height:100svh}
  .screen[data-on="1"]{display:flex}
  .pad{width:100%; max-width:1000px; margin:0 auto;
       padding-inline:max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px))}
  /* the meal screen is reading, not scanning — keep its measure short */
  #mealBody{max-width:800px}
  .fill{flex:1; display:flex; flex-direction:column; justify-content:center; padding-block:14px 22px}
  .scrolls{min-height:100vh; min-height:100svh}
  .anim{animation:fade .24s ease-out}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* ---------- nav bar ---------- */
  .nav{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
  .nav-in{width:100%; max-width:1000px; margin:0 auto;
          padding:9px max(18px, env(safe-area-inset-right, 0px)) 9px max(18px, env(safe-area-inset-left, 0px)); display:flex; align-items:center; gap:11px}
  .back{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; color:var(--ink-2);
    border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px 6px 9px; flex:0 0 auto}
  .back:hover{border-color:var(--line-strong); color:var(--ink)}
  .crumb{font-family:"IBM Plex Mono",monospace; font-size:13.5px; font-weight:600; color:var(--ink-3); letter-spacing:.05em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .navprog{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:var(--ink-2); flex:0 0 auto}
  .themebtn{border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:700; color:var(--ink-2); background:var(--surface); flex:0 0 auto}
  .themebtn:hover{border-color:var(--line-strong); color:var(--ink)}

  /* ---------- headings ---------- */
  .hd{margin-bottom:16px}
  .hd h1{font-size:clamp(32px,7.2vw,50px); line-height:1.03}
  .hd h1 em{font-style:italic; color:var(--green)}
  .hd .sub{margin-top:9px; color:var(--ink-2); font-size:17px; max-width:46ch}
  .hd .badges{display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap}
  .kind{font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; padding:4px 9px; border-radius:5px; background:var(--green-soft); color:var(--green)}
  .kind.g{background:var(--ochre-soft); color:var(--ochre)}
  .when{font-family:"IBM Plex Mono",monospace; font-size:14.5px; color:var(--ink-2)}

  .tally{display:flex; align-items:center; gap:11px; margin:12px 0 2px}
  /* day screen: the nav bar already shows the count, so just a bar */
  .slim{height:5px; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; overflow:hidden; margin:2px 0 14px}
  .slim i{display:block; height:100%; background:var(--green); border-radius:4px; transition:width .35s cubic-bezier(.2,.8,.3,1)}
  .tally-bar{flex:1; height:7px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; overflow:hidden}
  .tally-bar i{display:block; height:100%; background:var(--green); border-radius:5px; transition:width .4s cubic-bezier(.2,.8,.3,1)}
  .tally-n{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:15px; color:var(--ink-2); white-space:nowrap}

  /* ---------- pressable key, shared by every level ---------- */
  .k{position:relative; overflow:hidden; border:1px solid var(--line-strong); border-radius:15px; background:var(--surface);
     box-shadow:var(--press); transition:transform .12s cubic-bezier(.2,.8,.3,1), box-shadow .12s, background .2s, border-color .2s}
  .k:hover{transform:translateY(-3px); box-shadow:var(--press-hi)}
  .k:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line-strong)}
  .k .band{position:absolute; inset:0 0 auto 0; height:5px; background:var(--green)}
  .k[data-type="g"] .band{background:var(--ochre)}
  .k[data-type="prep"] .band{background:var(--slate)}
  .kind.p{background:var(--slate-soft); color:var(--slate)}
  .k[data-done="1"]{background:var(--green-soft); border-color:var(--green)}
  .k .tick{position:absolute; top:12px; right:12px; width:25px; height:25px; border-radius:50%;
    background:conic-gradient(var(--green) calc(var(--p, 0)*1%), var(--surface-2) 0); display:grid; place-items:center}
  .k .tick::after{content:""; width:16px; height:16px; border-radius:50%; background:var(--surface)}
  .k[data-done="1"] .tick{background:var(--green)}
  .k[data-done="1"] .tick::after{content:"✓"; width:auto; height:auto; background:none; color:var(--bg); font-size:14px; font-weight:800; line-height:1}
  :root[data-theme="dark"] .k[data-done="1"] .tick::after, :root:not([data-theme="light"]) .k[data-done="1"] .tick::after{color:#0F1A13}

  /* level 1 — plan cards */
  .plans{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .k.plan{padding:20px 20px 22px; display:flex; flex-direction:column}
  .k.plan .p-eye{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:6px}
  .k.plan .p-name{font-family:"Newsreader",serif; font-size:36px; line-height:1.1; margin-top:5px}
  .k.plan .p-len{font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--ink-2); margin-top:5px}
  .k.plan .p-bar{height:6px; background:var(--surface-2); border-radius:4px; margin-top:15px; overflow:hidden}
  .k.plan .p-bar i{display:block; height:100%; background:var(--green); border-radius:4px}
  .k.plan .p-go{display:flex; align-items:center; gap:7px; margin-top:15px; font-size:15px; font-weight:700; color:var(--green)}

  /* levels 2 & 3 — key grids */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  @media (max-width:520px){ .grid{grid-template-columns:repeat(2,1fr); gap:10px} }

  .k.day{padding:16px 16px 18px; display:flex; flex-direction:column}
  .k.day .d-lab{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:700; letter-spacing:.12em; color:var(--ink-3); margin-top:6px}
  .k.day .d-n{font-family:"Newsreader",serif; font-size:clamp(42px,9vw,62px); line-height:.92; margin-top:2px}
  .k.day .d-wd{font-size:17px; font-weight:800; letter-spacing:.05em; margin-top:7px}
  .k.day .d-dt{font-family:"IBM Plex Mono",monospace; font-size:14px; color:var(--ink-2); margin-top:2px}

  .k.meal{padding:16px 16px 17px; min-height:128px; display:flex; flex-direction:column}
  .k.meal .m-t{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:700; color:var(--green); letter-spacing:-.03em; margin-top:6px}
  .k.meal[data-type="buy"] .m-t, .k.meal[data-type="night"] .m-t{color:var(--slate)}
  .k.meal .m-n{font-size:17px; font-weight:700; line-height:1.22; margin-top:6px}
  .k.meal .m-c{font-size:13px; color:var(--ink-3); margin-top:auto; padding-top:10px; font-family:"IBM Plex Mono",monospace}
  .k.meal[data-type="buy"] .band, .k.meal[data-type="night"] .band{background:var(--slate)}

  /* level 4 — the meal */
  .fold{border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:11px; overflow:hidden}
  .fold[data-done="1"]{border-color:var(--green)}
  .fold-b{width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--sunken)}
  .fold[data-done="1"] .fold-b{background:var(--green-soft)}
  .fold-b h3{font-size:21px; flex:1; min-width:0}
  .fold-b .fc{font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:var(--ink-3); flex:0 0 auto}
  .fold-b .chev{transition:transform .2s; color:var(--ink-3); flex:0 0 auto}
  .fold-b[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .fold-body{padding:12px 16px 15px; border-top:1px solid var(--line)}
  .fold.night{border-color:var(--slate)}
  .fold.night .fold-b{background:var(--slate-soft)}

  .step{display:grid; grid-template-columns:20px 76px 1fr; gap:12px; align-items:start; padding:10px 0}
  .step + .step{border-top:1px dotted var(--line)}
  .step input{margin:4px 0 0; accent-color:var(--green); width:19px; height:19px; cursor:pointer}
  .step .sw{font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:var(--ink-3); padding-top:2px; font-weight:500}
  .step label{font-size:17px; line-height:1.52; cursor:pointer}
  .step.flag label{color:var(--flag); font-weight:600}
  .step input:checked ~ label{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong)}
  @media (max-width:470px){ .step{grid-template-columns:20px 1fr} .step .sw{grid-column:2; padding-top:0} .step label{grid-column:2} }

  .eatrow{display:flex; gap:12px; align-items:flex-start; padding:10px 0}
  .eatrow + .eatrow{border-top:1px dotted var(--line)}
  .eatrow input{margin:4px 0 0; accent-color:var(--green); width:19px; height:19px; flex:0 0 auto; cursor:pointer}
  .eatrow label{font-size:17.5px; line-height:1.42; cursor:pointer}
  .eatrow label .q{color:var(--ink-2); font-size:15px}
  .eatrow input:checked + label{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong)}
  .slotnote{margin-top:13px; font-size:14.5px; color:var(--ink-2); font-style:italic}
  .qfoot{margin-top:13px; font-size:14.5px; color:var(--ink-2); font-style:italic}

  .buycol{margin-bottom:14px}
  .buycol:last-child{margin-bottom:0}
  .buycol .eyebrow{display:block; margin-bottom:6px}
  .buycol li{display:flex; gap:11px; align-items:flex-start; padding:7px 0; font-size:16px}
  .buycol input{margin:4px 0 0; accent-color:var(--green); width:19px; height:19px; flex:0 0 auto; cursor:pointer}
  .buycol label{cursor:pointer; line-height:1.4}
  .buycol input:checked + label{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong)}

  .prevnext{display:flex; gap:9px; margin-top:16px}
  .pnbtn{flex:1; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:13px 15px; font-size:15px; font-weight:700; color:var(--ink-2)}
  .pnbtn:hover:not(:disabled){border-color:var(--line-strong); color:var(--ink)}
  .pnbtn:disabled{opacity:.4; cursor:default}
  .pnbtn .pn-l{display:block; font-size:11.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .pnbtn.next{text-align:right}

  .cleared{display:flex; align-items:center; gap:11px; background:var(--green-soft); border:1px solid var(--green);
    border-radius:13px; padding:12px 15px; margin-top:16px}
  .cleared b{font-family:"Newsreader",serif; font-size:20px; font-weight:600; color:var(--green-deep)}
  .cleared span{font-size:15px; color:var(--ink-2)}
  .resetbtn{display:inline-block; margin-top:20px; font-size:13.5px; color:var(--ink-3); text-decoration:underline; text-underline-offset:2px}
  .resetbtn:hover{color:var(--flag)}
  .legend{display:flex; gap:18px; margin-top:20px; flex-wrap:wrap; font-size:14px; color:var(--ink-2)}
  .legend span{display:flex; align-items:center; gap:7px}
  .legend i{width:12px; height:5px; border-radius:3px; background:var(--green); display:block}
  .legend i.g{background:var(--ochre)}
  .legend i.p{background:var(--slate)}
  .foot{border-top:1px solid var(--line); margin-top:30px; padding-block:16px calc(28px + env(safe-area-inset-bottom, 0px)); color:var(--ink-3); font-size:13px}

  .toasts{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none}
  .toast{background:var(--green); color:var(--bg); padding:11px 19px; border-radius:999px; font-weight:700; font-size:15.5px; animation:rise .3s cubic-bezier(.2,1.3,.4,1)}
  :root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{color:#0F1A13}
  @keyframes rise{from{opacity:0; transform:translateY(12px) scale(.94)}to{opacity:1; transform:none}}
  /* ---------- phone: everything a notch up, nothing under 14px ---------- */
  @media (max-width:560px){
    body{font-size:18px}
    .pad{padding-inline:16px}
    .eyebrow{font-size:13px}
    .crumb{font-size:13px; letter-spacing:.03em}
    .navprog{font-size:14.5px; font-weight:600}
    .back{font-size:15px}
    .hd .sub{font-size:17.5px}
    .kind{font-size:12.5px}
    .when{font-size:15px}
    .tally-n{font-size:15.5px}
    .k.day{padding:15px 14px 17px}
    .k.day .d-lab{font-size:12.5px}
    .k.day .d-wd{font-size:19px}
    .k.day .d-dt{font-size:15px}
    .k.meal{min-height:136px; padding:15px 14px 16px}
    .k.meal .m-t{font-size:23px}
    .k.meal .m-n{font-size:18px}
    .k.meal .m-c{font-size:14px}
    .k.plan .p-name{font-size:34px}
    .k.plan .p-len{font-size:16px}
    .k.plan .p-go{font-size:16px}
    .fold-b{padding:15px 15px}
    .fold-b h3{font-size:22px}
    .fold-b .fc{font-size:14.5px}
    .fold-body{padding:13px 15px 16px}
    .step label{font-size:18px; line-height:1.5}
    .step .sw{font-size:15px; font-weight:600}
    .eatrow label{font-size:19px}
    .eatrow label .q{font-size:16px}
    .buycol li{font-size:17.5px}
    .slotnote, .qfoot{font-size:15.5px}
    .pnbtn{font-size:16px}
    .legend{font-size:15px}
    .foot{font-size:14px}
    .cleared b{font-size:20px}
    .cleared span{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<nav class="nav" id="nav">
  <div class="nav-in">
    <button class="back" id="back" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="backlab">Back</span>
    </button>
    <span class="crumb" id="crumb"></span>
    <span class="navprog" id="navprog"></span>
    <button class="themebtn" id="themebtn" type="button">Dark</button>
  </div>
</nav>

<section class="screen" id="v-plans"><div class="pad fill" id="plansBody"></div></section>
<section class="screen" id="v-days"><div class="pad fill" id="daysBody"></div></section>
<section class="screen" id="v-day"><div class="pad fill" id="dayBody"></div></section>
<section class="screen" id="v-meal"><div class="pad scrolls" style="padding-block:18px 30px" id="mealBody"></div></section>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const WATER_STEPS = [
  {t:'4:45 am', d:'Put 1 tsp jeera and 1 tsp dhaniya seeds into 1½ glasses of water. Bring it to a boil, then simmer 5 minutes.'},
  {t:'5:00 am', d:'Strain it into a glass and drink it warm, before anything else.'},
  {t:'5:30 am', d:'Black coffee, no sugar — thirty minutes after the water, not before.'}
];
const WATER_EAT = [{n:'Jeera–dhaniya water', q:'1 glass'},{n:'Black coffee, no sugar', q:'1 cup at 5:30 am'}];
const CHIA_NIGHT = [{t:'8:40 pm', d:'Stir 5 g chia into 250 ml of water and leave it 20 minutes to gel. Drink it as the last thing.'}];

const D = {};

D.mon = {
  name:'Monday', wd:'MON', type:'gf',
  buy:{
    veg:['Cucumber — 2','Carrot — 1','Cabbage — 1 small','Tomato — 4','Onion — 2','Beans, carrot, beetroot, gobi — 200 g together','Ginger — a thumb','Mint — 1 bunch','Coriander — 1 bunch','Green chilli — 4','Apple — 1'],
    pantry:['Whole green gram — 1½ cups · soak tonight','Idli rice 1½ cups + urad dal ⅓ cup','Jeera and dhaniya seeds','Chia seeds','Almonds — 4','Groundnuts — 100 g, for the chutney','Coffee powder, green tea'],
    dairy:['Milk — 1 L, to set tonight’s curd','Curd — 1 cup for dinner','Curd — 2 tbsp as starter']
  },
  slots:[
    {t:'5:00 am', label:'Detox water', do:WATER_STEPS, eat:WATER_EAT},

/* ============================================================
   PLANS
   ------------------------------------------------------------
   To add a second ten-day plan later — a regular diet plan, say —
   copy the shape below. It needs its own `days` object (seven
   weekday templates with the same fields as D.mon above) and its
   own `schedule` array. Push it into PLANS and a switcher appears
   on the board by itself. Ticks are stored per plan, so two plans
   never overwrite each other's progress.
   ============================================================ */
const PLANS = [
  {id:'detox',
   name:'DetoxTen',
   unit:'Day', sequential:true, lenLabel:'10 days',
   eyebrow:'Alternating grain-free and grain days',
   title:'Ten days, <em>grain by grain</em>',
   sub:'Pick a day. You get everything to buy for it, and every step of prep timed to the meal it feeds.',
   days:D,
   schedule:SCHEDULE},
  {id:'lowcarb',
   name:'Low Carbs',
   eyebrow:'Seven options, three weeks',
   title:'Seven days, <em>any order</em>',
   sub:'Seven complete days. Pick whichever suits you, and shuffle them however you like across the three weeks.',
   unit:'Option', sequential:false, lenLabel:'7 daily options',
   days:L,
   schedule:LC_SCHEDULE}
];
/* ============================================================
   STATE
   ============================================================ */
/* keep this key as it is — renaming it wipes everyone's saved ticks */
const STORE = 'detox-ten-v5';
let state = {checks:{}, view:'plans', plan:'detox', day:0, slot:null, open:null, theme:null};
try{ const raw = localStorage.getItem(STORE); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
const ck = k => !!state.checks[k];

function plan(){ return PLANS.find(p=>p.id===state.plan) || PLANS[0]; }
function sched(){ return plan().schedule; }
function tpl(e){ return plan().days[e.key]; }
function unit(){ return plan().unit || 'Day'; }
function isSeq(){ return plan().sequential !== false; }
function nightOf(e){ return isSeq() ? (e.night || tpl(e).night) : null; }
function entry(){ return sched().find(x=>x.n===state.day) || sched()[0]; }
/* every stored tick is namespaced by plan id, so plans never collide */
function K(e, suffix){ return plan().id + ':d' + e.n + ':' + suffix; }

/* --- keys per unit of work --- */
function slotKeys(e, si){
  const s = tpl(e).slots[si];
  return s.do.map((_,i)=>K(e,'s'+si+':do'+i)).concat(s.eat.map((_,i)=>K(e,'s'+si+':eat'+i)));
}
function nightKeys(e){ const n0 = nightOf(e); return n0 ? n0.tasks.map((_,i)=>K(e,'n'+i)) : []; }
/* what must be in the house by tomorrow morning — Day 0 carries the whole pantry */
function shopFor(e){
  /* a sequence shops the night before; interchangeable options carry their own list */
  if(!isSeq()) return tpl(e).buy;
  const nx = sched().find(x=>x.n === e.n + 1);
  if(!nx) return null;
  return plan().days[nx.key].buy;
}
function buyKeys(e){
  const b = shopFor(e); if(!b) return [];
  const out = [];
  ['veg','pantry','dairy'].forEach(cat=>{ if(b[cat]) b[cat].forEach((_,i)=> out.push(K(e,'b'+cat.charAt(0)+i))); });
  return out;
}
function tonightKeys(e){ return buyKeys(e).concat(nightKeys(e)); }
function dayKeys(e){
  let out = [];
  tpl(e).slots.forEach((_,si)=> out = out.concat(slotKeys(e,si)) );
  return out.concat(tonightKeys(e));
}
const pct = ks => ks.length ? Math.round(ks.filter(ck).length/ks.length*100) : 0;
const allDone = ks => ks.length > 0 && ks.every(ck);
function dayDone(e){ return allDone(dayKeys(e)); }
function planPct(p){
  const keep = state.plan; state.plan = p.id;
  const real = p.schedule.filter(x=>x.n > 0);
  const done = real.filter(dayDone).length, total = real.length;
  state.plan = keep;
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}

const themebtn = document.getElementById('themebtn');
function applyTheme(){
  const r = document.documentElement;
  if(state.theme) r.setAttribute('data-theme', state.theme); else r.removeAttribute('data-theme');
  const dark = state.theme==='dark' || (!state.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  themebtn.textContent = dark ? 'Light' : 'Dark';
}
themebtn.addEventListener('click', ()=>{
  const dark = state.theme==='dark' || (!state.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  state.theme = dark ? 'light' : 'dark'; save(); applyTheme();
});
applyTheme();

const toastHost = document.getElementById('toasts');
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  toastHost.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; }, 1450);
  setTimeout(()=>el.remove(), 1800);
}

    '<div class="grid" id="dayGrid">'+
      sched().map(e=>{
        const t = tpl(e), ks = dayKeys(e);
        return '<button class="k day" type="button" data-n="'+e.n+'" data-type="'+(e.n===0?'prep':t.type)+'" data-done="'+(allDone(ks)?'1':'0')+'">'+
          '<span class="band"></span><span class="tick" style="--p:'+pct(ks)+'"></span>'+
          '<span class="d-lab">'+(e.n===0?'START':unit().toUpperCase())+'</span><span class="d-n">'+e.n+'</span>'+
          '<span class="d-wd">'+t.wd+'</span>'+
        '</button>';
      }).join('')+

    (isSeq() ? '<div class="legend"><span><i></i> Grain-free</span><span><i class="g"></i> Grain day</span><span><i class="p"></i> Prep evening</span></div>' : '')+'</div>';

   ============================================================ */
function renderDay(){
  const e = entry(), t = tpl(e);
  const cells = t.slots.map((s,si)=>{
    const ks = slotKeys(e,si);
    return '<button class="k meal" type="button" data-s="'+si+'" data-done="'+(allDone(ks)?'1':'0')+'">'+
      '<span class="band"></span><span class="tick" style="--p:'+pct(ks)+'"></span>'+
      '<span class="m-t">'+s.t+'</span><span class="m-n">'+s.label+'</span>'+
      '<span class="m-c">'+(s.do.length ? s.do.length+' prep · '+s.eat.length+' on plate' : s.eat.length+' on the plate')+'</span></button>';
  });
  const tk = tonightKeys(e), bk = buyKeys(e), nk = nightKeys(e);
  const isPrep = e.n === 0, isLast = !sched().some(x=>x.n === e.n + 1);
  const tile = '<button class="k meal" type="button" data-s="tonight" data-type="night" data-done="'+(allDone(tk)?'1':'0')+'">'+
    '<span class="band"></span><span class="tick" style="--p:'+pct(tk)+'"></span>'+
    '<span class="m-t">'+(!isSeq()?'SHOP':isPrep?'START':isLast?'AFTER':'TONIGHT')+'</span>'+
    '<span class="m-n">'+(!isSeq()?'What you need':isPrep?'Get set for Day 1':isLast?'After the detox':'Get ready for tomorrow')+'</span>'+
    '<span class="m-c">'+(bk.length ? bk.length+' to get'+(nk.length?' · '+nk.length+' to prep':'') : nk.length+' steps')+'</span></button>';
  if(isSeq()) cells.push(tile); else cells.unshift(tile);

  const ks = dayKeys(e);
  document.getElementById('dayBody').innerHTML =
    '<div class="anim"><div class="hd">'+
      '<p class="eyebrow">'+plan().name+'</p>'+
      '<h1>'+(e.n===0 ? 'Day 0 · Get set' : unit()+' '+e.n+' · '+t.name)+'</h1>'+
      '<div class="badges">'+(function(){const k=t.kind||(t.type==='gf'?'Grain-free':t.type==='g'?'Grain day':t.type==='prep'?'Before you start':'');return k?'<span class="kind '+(t.type==='g'?'g':t.type==='prep'?'p':'')+'">'+k+'</span>':'';})()+
        '</div>'+
    '</div>'+
    '<div class="slim"><i style="width:'+pct(ks)+'%"></i></div>'+
    '<div class="grid" id="mealGrid">'+cells.join('')+'</div>'+
    (allDone(ks) ? '<div class="cleared"><b>Day '+e.n+' cleared.</b><span>Every step and every plate.</span></div>' : '')+
    (function(){
      const pd = sched().find(x=>x.n===e.n-1), nd = sched().find(x=>x.n===e.n+1);
      const lab = d0 => unit()+' '+d0.n+' · '+plan().days[d0.key].name, u = unit().toLowerCase();
      return '<div class="prevnext">'+
        '<button class="pnbtn" type="button" id="dPrev"'+(pd?'':' disabled')+'>'+
          '<span class="pn-l">Previous '+u+'</span>'+(pd?lab(pd):'—')+'</button>'+
        '<button class="pnbtn next" type="button" id="dNext"'+(nd?'':' disabled')+'>'+
          '<span class="pn-l">Next '+u+'</span>'+(nd?lab(nd):'—')+'</button></div>';
    })()+
    '</div>';
  const hop = d => { state.day = state.day + d; save(); renderDay(); updateNav(); window.scrollTo(0,0); };
  const dp = document.getElementById('dPrev'), dn = document.getElementById('dNext');
  if(dp && !dp.disabled) dp.addEventListener('click', ()=>hop(-1));
  if(dn && !dn.disabled) dn.addEventListener('click', ()=>hop(1));

  document.getElementById('mealGrid').addEventListener('click', ev=>{
    const b = ev.target.closest('.k.meal'); if(!b) return;
    state.slot = (b.dataset.s === 'tonight') ? 'tonight' : Number(b.dataset.s);
    state.open = onlyOneFold(e, state.slot) ? '*' : null;
    go('meal');
  });
}

/* ============================================================
   LEVEL 4 — the meal itself, prep behind its own tap
   ============================================================ */
/* a slot with nothing to prep has only the plate fold — no point making them tap it */
function onlyOneFold(e, si){
  if(si === 'tonight') return !isSeq();
  const t = plan().days[e.key];
  return !!(t.slots[si] && t.slots[si].do.length === 0);
}
function stepHTML(id, s){
  return '<div class="step'+(s.flag?' flag':'')+'">'+
    '<input type="checkbox" id="'+id+'" data-k="'+id+'"'+(ck(id)?' checked':'')+'>'+
    '<span class="sw">'+s.t+'</span><label for="'+id+'">'+s.d+'</label></div>';
}
function foldHTML(name, title, count, body, done, extraClass){
  const open = state.open === name || state.open === '*';
  return '<div class="fold '+(extraClass||'')+'" data-done="'+(done?'1':'0')+'">'+
    '<button class="fold-b" type="button" data-fold="'+name+'" aria-expanded="'+open+'" aria-controls="fold-'+name+'">'+
      '<h3>'+title+'</h3><span class="fc">'+count+'</span>'+CHEV+'</button>'+
    '<div class="fold-body" id="fold-'+name+'"'+(open?'':' hidden')+'>'+body+'</div></div>';
}

function renderMeal(){
  const e = entry(), t = tpl(e), si = state.slot;
  let title, when, folds;

  if(si === 'tonight'){
    const b = shopFor(e), n = nightOf(e), isPrep = e.n === 0, seqp = isSeq();
    const col = (arr, cat) => '<ul>'+arr.map((it,i)=>{
        const id = K(e,'b'+cat+i);
        return '<li><input type="checkbox" id="'+id+'" data-k="'+id+'"'+(ck(id)?' checked':'')+'><label for="'+id+'">'+it+'</label></li>';
      }).join('')+'</ul>';
    title = !seqp ? 'What you need' : isPrep ? 'Get set' : (b ? 'Tonight' : 'After the detox');
    when  = !seqp ? 'Everything this option calls for' : isPrep ? 'Before the plan starts' : 'Sets up ' + n.head;
    folds = '';
    if(b){
      const groups = [['veg','Fruit & vegetables','v'],['pantry','From the pantry','p'],['dairy','Dairy','d']]
        .filter(g=>b[g[0]] && b[g[0]].length);
      const total = groups.reduce((a,g)=>a+b[g[0]].length,0);
      const body = groups.map(g=>'<div class="buycol"><span class="eyebrow">'+g[1]+'</span>'+col(b[g[0]], g[2])+'</div>').join('');
      folds += foldHTML('shop', 'Have in by morning', total+' items', body, allDone(buyKeys(e)));
    }
    if(n) folds += foldHTML('prep', b ? 'Soak & set tonight' : 'What happens next',
      n.tasks.length+' steps',
      n.tasks.map((st,i)=> stepHTML(K(e,'n'+i), st)).join('') + '<p class="qfoot">'+n.foot+'</p>',
      allDone(nightKeys(e)), 'night');
  } else {
    const s = t.slots[si];
    title = s.label; when = s.t;
    const prepKs = s.do.map((_,i)=>K(e,'s'+si+':do'+i));
    const eatKs  = s.eat.map((_,i)=>K(e,'s'+si+':eat'+i));
    folds = (s.do.length ?
      foldHTML('prep', 'Prep', s.do.length+' steps',
        s.do.map((st,i)=> stepHTML(K(e,'s'+si+':do'+i), st)).join(''), allDone(prepKs)) : '')+
      foldHTML('plate', 'On the plate', s.eat.length+' items',
        s.eat.map((it,i)=>{
          const id = K(e,'s'+si+':eat'+i);
          return '<div class="eatrow"><input type="checkbox" id="'+id+'" data-k="'+id+'"'+(ck(id)?' checked':'')+'>'+
            '<label for="'+id+'">'+it.n+(it.q?' <span class="q">— '+it.q+'</span>':'')+'</label></div>';
        }).join('') + (s.note ? '<p class="slotnote">'+s.note+'</p>' : ''), allDone(eatKs));
  }

  /* previous / next — runs straight through the plan, not just this day */
  const seq = [];
  sched().forEach(d0=>{
    plan().days[d0.key].slots.forEach((_,i)=> seq.push({n:d0.n, slot:i}));
    seq.push({n:d0.n, slot:'tonight'});
  });
  const at = seq.findIndex(x=> x.n===e.n && String(x.slot)===String(si));
  const nameOf = it => {
    const de = sched().find(x=>x.n===it.n), dt = plan().days[de.key];
    const nm = it.slot==='tonight' ? (!isSeq() ? 'What you need' : it.n===0 ? 'Get set' : 'Tonight') : dt.slots[it.slot].label;
    return it.n===e.n ? nm : unit()+' '+it.n+' · '+nm;
  };

  document.getElementById('mealBody').innerHTML =
    '<div class="anim"><div class="hd">'+
      '<p class="eyebrow">'+(e.n===0 ? 'Day 0 · Sunday' : unit()+' '+e.n+' · '+t.name)+'</p>'+
      '<h1>'+title+'</h1><div class="badges"><span class="when">'+when+'</span></div>'+
    '</div>'+ folds +
    '<div class="prevnext">'+
      '<button class="pnbtn" type="button" id="pnPrev"'+(at<=0?' disabled':'')+'>'+
        '<span class="pn-l">Previous</span>'+(at>0?nameOf(seq[at-1]):'—')+'</button>'+
      '<button class="pnbtn next" type="button" id="pnNext"'+(at>=seq.length-1?' disabled':'')+'>'+
        '<span class="pn-l">Next</span>'+(at<seq.length-1?nameOf(seq[at+1]):'—')+'</button>'+
    '</div>'+
    '<button class="resetbtn" id="resetday" type="button">Clear Day '+e.n+'’s ticks</button>'+
    '<div class="foot">Plan by Aayurspandana · Ayur-Aahar-Aarogya. Ticks are saved in this browser only.</div>'+
    '</div>';

  const body = document.getElementById('mealBody');

  body.querySelectorAll('.fold-b').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.fold, isOpen = btn.getAttribute('aria-expanded')==='true';
      body.querySelectorAll('.fold-b').forEach(o=>{
        const on = (o === btn) && !isOpen;
        o.setAttribute('aria-expanded', String(on));
        document.getElementById('fold-'+o.dataset.fold).hidden = !on;
      });
      state.open = isOpen ? null : name; save();
    });
  });

  body.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const wasDay = dayDone(e);
      if(cb.checked) state.checks[cb.dataset.k] = 1; else delete state.checks[cb.dataset.k];
      save();
      const fold = cb.closest('.fold');
      if(fold){
        const ins = [...fold.querySelectorAll('input[type="checkbox"]')];
        const done = ins.length && ins.every(x=>x.checked);
        if(done && fold.dataset.done !== '1') toast(fold.querySelector('h3').textContent + ' done');
        fold.dataset.done = done ? '1' : '0';
      }
      if(!wasDay && dayDone(e)) setTimeout(()=>toast('Day '+e.n+' cleared'), 260);
      updateNav();
    });
  });

  const step = d => {
    const it = seq[at + d]; if(!it) return;
    state.day = it.n; state.slot = it.slot; state.open = onlyOneFold(sched().find(x=>x.n===it.n), it.slot) ? '*' : null; save();
    renderMeal(); updateNav(); window.scrollTo(0,0);
  };
  const pv = document.getElementById('pnPrev'), nx = document.getElementById('pnNext');
  if(!pv.disabled) pv.addEventListener('click', ()=>step(-1));
  if(!nx.disabled) nx.addEventListener('click', ()=>step(1));

  document.getElementById('resetday').addEventListener('click', ()=>{
    const pre = plan().id+':d'+e.n+':';
    Object.keys(state.checks).forEach(k=>{ if(k.indexOf(pre)===0) delete state.checks[k]; });
    save(); renderMeal(); updateNav();
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
const VIEWS = ['plans','days','day','meal'];
const UP = {days:'plans', day:'days', meal:'day'};

function updateNav(){
  const back = document.getElementById('back');
  const crumb = document.getElementById('crumb');
  const prog = document.getElementById('navprog');
  back.hidden = state.view === 'plans';
  const labels = {plans:'', days:'Plans', day:plan().name, meal:unit()+' '+state.day};
  document.getElementById('backlab').textContent = labels[state.view] || 'Back';

  const e = entry(), t = tpl(e);
  if(state.view === 'plans'){ crumb.textContent = 'PLANS'; prog.textContent = ''; }
  else if(state.view === 'days'){
    const s = planPct(plan());
    crumb.textContent = plan().name.toUpperCase();
    prog.textContent = s.done + '/' + s.total + ' days';
  } else if(state.view === 'day'){
    const ks = dayKeys(e);
    crumb.textContent = unit().toUpperCase()+' ' + e.n + ' · ' + t.wd;
    prog.textContent = ks.filter(ck).length + '/' + ks.length;
  } else {
    const si = state.slot;
    const nm = si==='tonight' ? (!isSeq() ? 'WHAT YOU NEED' : e.n===0 ? 'GET SET' : 'TONIGHT') : t.slots[si].label.toUpperCase();
    crumb.textContent = (e.n===0 ? 'DAY 0' : unit().toUpperCase()+' ' + e.n) + ' · ' + nm;
    const ks = si==='tonight' ? tonightKeys(e) : slotKeys(e,si);
    prog.textContent = ks.filter(ck).length + '/' + ks.length;
  }
}

function go(view){
  state.view = view; save();
  VIEWS.forEach(v=> document.getElementById('v-'+v).dataset.on = (v===view ? '1' : '0'));
  if(view==='plans') renderPlans();
  if(view==='days')  renderDays();
  if(view==='day')   renderDay();
  if(view==='meal')  renderMeal();
  updateNav();
  window.scrollTo(0,0);
}
document.getElementById('back').addEventListener('click', ()=> go(UP[state.view] || 'plans'));
document.addEventListener('keydown', ev=>{
  if(ev.key === 'Escape' && state.view !== 'plans') go(UP[state.view]);
});

/* boot — resume where they left off, but never on a stale slot */
if(state.view === 'meal'){
  const s0 = state.slot, n = tpl(entry()).slots.length;
  const ok = s0==='tonight' || (typeof s0==='number' && s0>=0 && s0<n);
  if(!ok) state.view = 'day';
}
if(!VIEWS.includes(state.view)) state.view = 'plans';
go(state.view);
</script>
